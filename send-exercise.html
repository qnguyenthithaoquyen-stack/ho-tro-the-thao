<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Bài Tập - Hỗ Trợ Huấn Luyện</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

        /* --- Reset & base --- */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; }
        
        :root {
            --primary-color: #008080;
            --background-color: #f0f4f8;
            --card-bg-color: #ffffff;
            --text-color: #333;
            --text-light-color: #6c757d;
            --border-color: #e9ecef;
            --shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.4;
        }

        /* --- Header full width --- */
        .header {
            background-color: var(--primary-color);
            color: #fff;
            padding: 12px clamp(16px, 4vw, 30px);
            width: 100%;
        }
        .header-inner {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }

        /* >>> Logo ảnh – đồng bộ như các trang khác <<< */
        .logo{
            height:50px;       /* chiều cao cố định */
            width:auto;        /* giữ tỉ lệ */
            border-radius:6px; /* bo góc */
            background:#fff;   /* nền trắng */
            padding:2px;       /* viền trắng mỏng */
            object-fit:contain;
            display:block;
        }

        .project-info h1 { font-size: clamp(18px, 2.2vw, 24px); margin: 0; }
        .project-info p { font-size: clamp(10px, 1.4vw, 12px); margin: 0; opacity: 0.9; }

        /* --- Navbar: căn trái --- */
        .navbar {
            background-color: var(--card-bg-color);
            box-shadow: 0 2px 4px rgba(0,0,0,.05);
            padding: 0;
            width: 100%;
            display: flex;
        }
        .nav-inner {
            display: flex;
            gap: 2px;
            justify-content: flex-start;
            padding: 0 clamp(16px, 4vw, 30px);
            width: 100%;
        }

        .navbar a {
            padding: 14px clamp(14px, 2.2vw, 25px);
            text-decoration: none;
            color: var(--text-light-color);
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: color .25s, border-color .25s, background-color .25s;
            border-radius: 8px 8px 0 0;
        }
        .navbar a.active, .navbar a:hover { color: var(--primary-color); border-bottom-color: var(--primary-color); background: #f8fbfb; }

        /* --- Layout --- */
        .main-content {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: clamp(20px, 4vw, 50px) clamp(16px, 4vw, 30px);
            min-height: calc(100vh - 120px);
        }

        .exercise-form-card {
            background-color: var(--card-bg-color);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: clamp(20px, 3.2vw, 40px);
            width: 100%;
            max-width: 760px;
        }

        .form-header { text-align: center; margin-bottom: 24px; }
        .form-header h2 { font-size: clamp(22px, 3vw, 28px); color: var(--primary-color); margin: 0; }
        .form-header p { font-size: clamp(14px, 1.8vw, 16px); color: var(--text-light-color); margin-top: 10px; }
        .form-header #athleteName { font-weight: 700; color: var(--text-color); }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 16px;
            transition: border-color .25s, box-shadow .25s;
            font-family: 'Roboto', sans-serif;
            background: #fff;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 128, 128, 0.15);
        }
        .form-group textarea { resize: vertical; min-height: 120px; }

        /* --- Actions --- */
        .form-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 26px;
            justify-content: flex-end;
            flex-wrap: nowrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 22px;
            border-radius: 10px;
            border: 1px solid transparent;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .15s ease, box-shadow .15s ease, background-color .25s ease, border-color .25s ease;
            text-align: center;
            min-width: 138px;
            white-space: nowrap;
        }

        .btn-secondary {
            background-color: #e9ecef;
            color: var(--text-color);
            border-color: #ced4da;
        }
        .btn-secondary:hover { background-color: #d8dde2; }

        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: #006666; transform: translateY(-1px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn-primary:disabled { background-color: #a0c4c4; cursor: not-allowed; transform: none; box-shadow: none; }

        .message {
            text-align: center;
            padding: 10px;
            margin-bottom: 16px;
            border-radius: 10px;
            display: none;
            font-size: 14px;
        }
        .message.success { background-color: #d4edda; color: #155724; }
        .message.error { background-color: #f8d7da; color: #721c24; }

        /* Responsive */
        @media (max-width: 768px) {
            .form-actions {
                justify-content: center;
                flex-wrap: wrap;
                gap: 10px 12px;
            }
            .btn { width: clamp(140px, 44vw, 260px); }
        }
        @media (max-width: 520px) {
            .form-actions { justify-content: center; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="header-left">
                <!-- Logo ảnh đồng bộ -->
                <img src="5f4a128d-c63a-46ad-92a7-94b6c5bbb49e.jpg" alt="Logo" class="logo">
                <div class="project-info">
                    <h1>THỂ THAO THÔNG MINH</h1></h1>
                    <p>DỰ ÁN KHOA HỌC KỸ THUẬT</p>
                </div>
            </div>
        </div>
    </header>

    <nav class="navbar">
        <div class="nav-inner">
            <a href="index.html">Trang chủ</a>
            <a href="gioithieu.html">Giới thiệu</a>
            <a href="coach-dashboard.html" class="active">Bảng điều khiển</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="exercise-form-card">
            <div class="form-header">
                <h2>Gửi bài tập mới</h2>
                <p>Gửi cho VĐV: <b id="athleteName">Đang tải...</b></p>
            </div>

            <div id="message" class="message"></div>

            <form id="exerciseForm">
                <div class="form-group">
                    <label for="title">Tiêu đề bài tập</label>
                    <input type="text" id="title" name="title" placeholder="Ví dụ: Chạy bền 5km" required>
                </div>

                <div class="form-group">
                    <label for="description">Mô tả chi tiết</label>
                    <textarea id="description" name="description" placeholder="Mô tả các yêu cầu, tốc độ, thời gian nghỉ..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="dueDate">Ngày thực hiện</label>
                    <input type="date" id="dueDate" name="dueDate" required>
                </div>

                <div class="form-actions">
                    <a href="coach-dashboard.html" class="btn btn-secondary">Hủy</a>
                    <button type="submit" class="btn btn-primary">Gửi bài tập</button>
                </div>
            </form>
        </div>
    </main>

    <script type="module">
        // Firebase SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

        // Config
        const firebaseConfig = {
            apiKey: "AIzaSyA2dXWCyjL2xgCSyeW9QQ7RvjI_O7kFHJw",
            authDomain: "sporthealthdata.firebaseapp.com",
            projectId: "sporthealthdata",
            storageBucket: "sporthealthdata.appspot.com",
            messagingSenderId: "789054240877",
            appId: "1:789054240877:web:04a400c9ea586523a86764",
        };

        // Init
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.addEventListener('DOMContentLoaded', () => {
            const athleteNameEl = document.getElementById('athleteName');
            const exerciseForm = document.getElementById('exerciseForm');
            const messageDiv = document.getElementById('message');
            let athleteId = null;

            onAuthStateChanged(auth, (user) => {
                if (!user) window.location.href = './dangnhap.html';
            });

            async function loadAthleteInfo() {
                const params = new URLSearchParams(window.location.search);
                athleteId = params.get('athleteId');
                if (!athleteId) { athleteNameEl.textContent = "Không tìm thấy VĐV"; return; }

                try {
                    const athleteDocRef = doc(db, "users", athleteId);
                    const athleteDocSnap = await getDoc(athleteDocRef);
                    if (athleteDocSnap.exists()) {
                        athleteNameEl.textContent = athleteDocSnap.data().fullName || "VĐV không tên";
                    } else {
                        athleteNameEl.textContent = "VĐV không tồn tại";
                    }
                } catch (err) {
                    console.error("Lỗi khi tải thông tin VĐV:", err);
                    athleteNameEl.textContent = "Lỗi tải dữ liệu";
                }
            }

            exerciseForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!athleteId) { alert("Không xác định được VĐV để gửi bài tập."); return; }

                const submitButton = exerciseForm.querySelector('button[type="submit"]');
                const title = exerciseForm.title.value.trim();
                const description = exerciseForm.description.value.trim();
                const dueDate = exerciseForm.dueDate.value;

                submitButton.disabled = true;
                submitButton.textContent = 'Đang gửi...';
                messageDiv.style.display = 'none';

                try {
                    const exercisesColRef = collection(db, "users", athleteId, "exercises");
                    await addDoc(exercisesColRef, {
                        title, description, dueDate,
                        status: 'pending',
                        createdAt: serverTimestamp()
                    });

                    messageDiv.textContent = "Gửi bài tập thành công!";
                    messageDiv.className = "message success";
                    messageDiv.style.display = 'block';

                    setTimeout(() => { window.location.href = 'coach-dashboard.html'; }, 1500);
                } catch (error) {
                    console.error("Lỗi khi gửi bài tập:", error);
                    messageDiv.textContent = "Đã xảy ra lỗi khi gửi. Vui lòng thử lại.";
                    messageDiv.className = "message error";
                    messageDiv.style.display = 'block';
                    submitButton.disabled = false;
                    submitButton.textContent = 'Gửi bài tập';
                }
            });

            loadAthleteInfo();
        });
    </script>
</body>
</html>
